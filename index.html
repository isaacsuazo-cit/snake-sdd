<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Snake</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./src/styles.css">
</head>
<body>
  <main class="game">
    <header class="game__header">
      <h1 class="game__title">Snake</h1>
      <p id="hud" class="hud" aria-live="polite">Score: 0</p>
      <p id="best" class="best">Best: 0</p>
    </header>
    <div id="board-wrap" class="board-wrap">
      <canvas id="board" width="400" height="400">Snake game board. Your browser does not support canvas.</canvas>
      <div id="overlay" class="overlay" hidden>
        <h2 id="overlay-title" class="overlay__title"></h2>
        <p id="overlay-score" class="overlay__score"></p>
        <p id="overlay-hint" class="overlay__hint"></p>
      </div>
    </div>
    <aside id="panel" class="panel" aria-labelledby="panel-title">
      <h2 id="panel-title">How to play</h2>
      <dl class="panel__stats" aria-live="polite" aria-atomic="true">
        <dt>Level</dt>
        <dd id="level">Level 1</dd>
        <dt>Speed</dt>
        <dd id="speed">150 ms / tick</dd>
      </dl>
      <ul class="panel__list">
        <li>Arrow keys or WASD to move</li>
        <li>Enter or Space to restart</li>
      </ul>
      <ul class="panel__legend">
        <li><span class="swatch swatch--food" aria-hidden="true"></span>Apple — grow +1 score</li>
        <li><span class="swatch swatch--food-negative" aria-hidden="true"></span>Negative apple — shrink 2, no score</li>
        <li><span class="swatch swatch--wall" aria-hidden="true"></span>Wall — game over on contact</li>
      </ul>
    </aside>
  </main>

  <!-- Module scripts are blocked on file:// (CORS). Serve over HTTP, e.g. python3 -m http.server 8000, then open http://localhost:8000 -->
  <script type="module" src="./src/main.js"></script>
</body>
</html>
